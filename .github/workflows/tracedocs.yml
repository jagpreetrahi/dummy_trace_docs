# TraceDocs — documentation impact analysis for pull requests.
#
# Advisory by default: this workflow reads the repository and posts its
# findings to the job summary and as inline "Files changed" annotations —
# neither requires write access to the repository or the pull request.
# See docs/architecture.md and docs/github-actions.md for the full
# permissions rationale and setup notes.
#
# This file lives in TraceDocs' own repository, so it analyzes TraceDocs'
# own pull requests (dogfooding) by building the CLI from source on every
# run. A project that depends on TraceDocs as a published package would
# replace the "Install dependencies" / "Build" steps with installing that
# package instead (e.g. `npx tracedocs report ...`), and drop the first
# three steps entirely.

name: TraceDocs Documentation Impact

on:
  pull_request:
    types: [opened, synchronize, reopened]

# Read-only. No step in the default job writes to the repository or the
# pull request — see the optional, disabled-by-default comment job below
# for the one thing that needs `pull-requests: write`, kept separate on
# purpose (brief: write access must be opt-in and narrowly scoped).
permissions:
  contents: read
  pull-requests: read

jobs:
  report:
    name: Analyze documentation impact
    runs-on: ubuntu-latest
    steps:
      - name: Check out the pull request head
        uses: actions/checkout@v4
        with:
          # Full history so the PR's base commit is available locally —
          # `tracedocs report` needs to read file content at --base, not
          # just diff against it.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # >=22.5 required: the graph package uses the built-in
          # node:sqlite module, which doesn't exist before 22.5.
          node-version: '22'

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build TraceDocs
        run: pnpm run build

      - name: Write the job summary
        run: |
          node packages/cli/dist/index.js report . \
            --base "${{ github.event.pull_request.base.sha }}" \
            --format markdown >> "$GITHUB_STEP_SUMMARY"

      - name: Emit inline annotations
        # Prints `::warning file=...,line=...::message` / `::notice ...`
        # lines. GitHub turns these into annotations on this run's "Files
        # changed" tab automatically — no extra permission needed, and
        # nothing is posted anywhere outside this job's own output.
        run: |
          node packages/cli/dist/index.js report . \
            --base "${{ github.event.pull_request.base.sha }}" \
            --format annotations

  # --- Optional: post the report as a PR comment instead of/in addition
  # to the job summary. Disabled by default (`if: false`) — this is the
  # one part of the workflow that needs write access. To enable: change
  # `if: false` to `if: true` below AND add
  #   permissions:
  #     pull-requests: write
  # to this job specifically (not the whole workflow) so the elevated
  # permission stays scoped to only the step that needs it.
  comment:
    name: Post report as a PR comment (opt-in, disabled by default)
    if: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Generate report
        run: |
          node packages/cli/dist/index.js report . \
            --base "${{ github.event.pull_request.base.sha }}" \
            --format markdown --out report.md
      - name: Comment on the pull request
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('report.md', 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
